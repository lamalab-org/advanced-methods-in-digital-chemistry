project:
  type: book
  output-dir: _book
  render:
    - index.qmd
    - outline.qmd
    - setup.qmd
    - cli-assistant.qmd
    - glossary.qmd
    - reading.qmd
    - lectures/*.qmd
  resources:
    - activities/**
    - notebooks/**
    - downloads/**
    - data/**
    - assets/fonts/**
    - assets/lamalab.css
    - assets/activities.css
    - "!instructor/"
    - "!_instructor/"
    - "!.venv/"
    - "!.venv/**"

book:
  title: "Advanced Methods in Digital Chemistry"
  subtitle: "Scientific questions, learning from data, and chemical discovery"
  author: "Kevin Maik Jablonka"
  site-url: https://lamalab-org.github.io/advanced-methods-in-digital-chemistry/
  repo-url: https://github.com/lamalab-org/advanced-methods-in-digital-chemistry
  sidebar:
    logo: assets/lamalab-logo.png
    logo-alt: "LAMALAB — Lab for AI in Materials Science"
    logo-href: https://lamalab.org/
  page-footer:
    left: "[lamalab](https://lamalab.org/) / teaching"
    center: "[Developed with Codex](/index.qmd#about-these-notes)"
    right: "Kevin Maik Jablonka · Friedrich Schiller University Jena"
  chapters:
    - index.qmd
    - outline.qmd
    - setup.qmd
    - lectures/01-ai-and-science.qmd
    - lectures/02-learning-from-data.qmd
    - lectures/03-mof-uptake.qmd
  appendices:
    - cli-assistant.qmd
    - glossary.qmd
    - reading.qmd

format:
  html:
    theme:
      - default
      - assets/lamalab.scss
    css: assets/course.css
    toc: true
    toc-depth: 2
    number-sections: false
    code-copy: true
    link-external-newwindow: true
    html-math-method: mathjax
    lang: en

execute:
  error: false
