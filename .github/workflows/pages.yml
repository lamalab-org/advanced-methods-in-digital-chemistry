name: Publish course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out course sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.24'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Render student book
        run: quarto render course
      - name: Check public output
        run: python3 course/scripts/check_site.py course/_book
      - name: Upload student site
        uses: actions/upload-pages-artifact@v4
        with:
          path: course/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
