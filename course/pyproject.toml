[project]
name = "digital-chemistry-course"
version = "0.1.0"
description = "Small notebook environment for the introductory digital chemistry sessions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "nbformat>=5.9,<6",
  "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["nbclient>=0.10,<0.11"]
mof = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2"]

[tool.uv]
package = false
default-groups = []
