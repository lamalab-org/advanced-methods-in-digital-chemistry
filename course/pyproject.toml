[project]
name = "digital-chemistry-course"
version = "0.1.0"
description = "Small marimo environment for the introductory digital chemistry sessions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marimo>=0.25.2,<0.26",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
]

[dependency-groups]
mof = ["pandas>=2.2,<3", "scikit-learn>=1.5,<2"]

[tool.uv]
package = false
default-groups = []

[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"
